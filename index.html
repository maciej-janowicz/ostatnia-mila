<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ostatnia mila komisarza Głąba</title>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Courier+Prime:wght@400;700&display=swap">
<style>
/* Układ: dziennik pościgu emerytowanego komisarza — kartki notesu, stemple paszportowe, bilety kolejowe; jeden rozdział = jeden kontynent = jedna technologia dostępowa */
:root{
  --papier:#efe9dd; --karta:#faf6ee; --karta2:#f1eadb; --linia:#cdbfa5;
  --atrament:#23211c; --szary:#6b6455;
  --pieczec:#9c2f2a; --mosiadz:#8a6a1f; --zielen:#2f6b52; --nieb:#2b5c8a;
  --f-tytul:"DM Serif Display","Didot","Bodoni 72",Georgia,serif;
  --f-txt:"Source Serif 4","Iowan Old Style",Georgia,serif;
  --f-mono:"Courier Prime","Courier New",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --papier:#171512; --karta:#211e19; --karta2:#2a261f; --linia:#3d372d;
  --atrament:#ece5d6; --szary:#a69d8a; --pieczec:#e0766b; --mosiadz:#d6b261; --zielen:#6cc29a; --nieb:#7fb2e0; color-scheme:dark}}
:root[data-theme="dark"]{
  --papier:#171512; --karta:#211e19; --karta2:#2a261f; --linia:#3d372d;
  --atrament:#ece5d6; --szary:#a69d8a; --pieczec:#e0766b; --mosiadz:#d6b261; --zielen:#6cc29a; --nieb:#7fb2e0; color-scheme:dark}
html{background:var(--papier)}
body{background:var(--papier);color:var(--atrament);font-family:var(--f-txt);font-size:17px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--papier)}
.wrap{max-width:660px;margin:0 auto}
h1,h2{font-family:var(--f-tytul);font-weight:400;line-height:1.05;margin:0;text-wrap:balance}
h1{font-size:clamp(2.3rem,11vw,3.7rem)}
h2{font-size:clamp(1.8rem,7vw,2.4rem)}
h3{font-family:var(--f-mono);font-size:.82rem;letter-spacing:.16em;text-transform:uppercase;color:var(--szary);margin:6px 0 0;font-weight:700}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.etykieta{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--szary)}
.stos{display:flex;flex-direction:column;gap:18px}
.pasek{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--papier);border-bottom:2px solid var(--atrament);
  display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;margin-bottom:20px;flex-wrap:wrap}
.pasek .lewy{display:flex;gap:8px}
.btn{font:inherit;font-family:var(--f-mono);font-size:.86rem;background:var(--karta);color:var(--atrament);border:1.5px solid var(--atrament);
  border-radius:2px;padding:8px 12px;cursor:pointer;line-height:1.2}
.btn:hover:not([disabled]){background:var(--karta2)}
.btn:focus-visible,input:focus-visible,select:focus-visible,.opcja:focus-visible,.zeton:focus-visible{outline:3px solid var(--mosiadz);outline-offset:2px}
.btn.glowny{background:var(--atrament);color:var(--papier);font-weight:700}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.okladka{padding-block:14px 4px;display:flex;flex-direction:column;gap:14px;position:relative}
.pieczec{display:inline-block;align-self:flex-start;font-family:var(--f-mono);font-weight:700;letter-spacing:.2em;color:var(--pieczec);
  border:3px double var(--pieczec);border-radius:8px;padding:4px 10px;transform:rotate(-4deg);font-size:.9rem}
.sygn{font-family:var(--f-mono);font-size:.8rem;color:var(--szary);border-top:1px dashed var(--linia);border-bottom:1px dashed var(--linia);padding:6px 0}
input[type=text],input[type=number],select{font:inherit;font-family:var(--f-mono);background:var(--karta);color:var(--atrament);
  border:1.5px solid var(--linia);border-radius:2px;padding:9px 10px;min-width:0;width:100%;box-sizing:border-box}
label.etykieta{display:block}
.spis{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.spis li{border-bottom:1px solid var(--linia)}
.spis button{all:unset;cursor:pointer;display:grid;grid-template-columns:3.4rem 1fr auto;gap:10px;align-items:baseline;padding:12px 2px;width:100%;box-sizing:border-box}
.spis button:focus-visible{outline:3px solid var(--mosiadz)}
.spis .w{font-family:var(--f-mono);font-weight:700;color:var(--pieczec);font-size:.86rem}
.spis .t{font-family:var(--f-txt);font-weight:600;font-size:1.05rem;min-width:0}
.spis .t small{display:block;font-weight:400;color:var(--szary);font-family:var(--f-mono);font-size:.74rem;letter-spacing:.06em}
.spis .s{font-family:var(--f-mono);font-size:.78rem;color:var(--szary);white-space:nowrap}
.spis li.zamkniete .t{color:var(--szary)}
.spis li.zrobione .s{color:var(--zielen)}
.dziennik{font-family:var(--f-mono);background:var(--karta);border:1px solid var(--linia);padding:14px 16px;font-size:.95rem;line-height:1.6;
  box-shadow:3px 3px 0 var(--linia);background-image:repeating-linear-gradient(transparent 0 27px,var(--karta2) 27px 28px)}
.dziennik b{color:var(--pieczec)}
.trop{border:1.5px dashed var(--zielen);padding:10px 14px;font-size:.95rem;background:var(--karta)}
.trop .etykieta{color:var(--zielen)}
.karta{background:var(--karta);border-left:3px solid var(--atrament);padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.karta h4{margin:0;font-family:var(--f-txt);font-weight:600;font-size:1.02rem}
.karta ul{margin:0;padding-left:20px}
.wzor{font-family:var(--f-mono);background:var(--karta2);padding:8px 10px;font-size:.86rem;overflow-x:auto;white-space:pre}
.replika{display:grid;grid-template-columns:6.4rem 1fr;gap:4px 10px;font-size:.98rem}
.replika dt{font-family:var(--f-mono);font-weight:700;font-size:.76rem;letter-spacing:.04em;padding-top:3px}
.replika dd{margin:0;min-width:0}
.zagadka{background:var(--karta);border:1px solid var(--linia);padding:14px;display:flex;flex-direction:column;gap:10px}
.zagadka.rozw{border-color:var(--zielen)}
.zagadka .nr{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.opcje{display:flex;flex-direction:column;gap:8px}
.opcja{font:inherit;text-align:left;background:var(--papier);color:var(--atrament);border:1.5px solid var(--linia);border-radius:2px;padding:10px 12px;cursor:pointer}
.opcja:hover:not([disabled]){border-color:var(--atrament)}
.opcja.zla{border-color:var(--pieczec);color:var(--szary);text-decoration:line-through}
.opcja.dobra{border-color:var(--zielen);font-weight:600}
.opcja[disabled]{cursor:default}
.liczba{display:flex;gap:8px;flex-wrap:wrap}
.liczba input{flex:1 1 140px;width:auto}
.wyjasnienie{font-size:.95rem;border-top:1px dashed var(--linia);padding-top:8px}
.ok{color:var(--zielen)} .zle{color:var(--pieczec)}
.tor{display:flex;flex-wrap:wrap;gap:6px;min-height:46px;padding:8px;border:1.5px dashed var(--linia);background:var(--papier)}
.pula{display:flex;flex-wrap:wrap;gap:6px}
.zeton{font:inherit;font-family:var(--f-mono);font-size:.86rem;background:var(--karta2);color:var(--atrament);border:1.5px solid var(--atrament);
  border-radius:2px;padding:7px 10px;cursor:pointer}
.tor .zeton{background:var(--atrament);color:var(--papier)}
.tor .zeton .n{opacity:.6;margin-right:4px}
.dopasuj{display:grid;grid-template-columns:1fr minmax(8rem,12rem);gap:8px 10px;align-items:center}
.dopasuj span{min-width:0}
.nawigacja{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
.cert{border:3px double var(--atrament);background:var(--karta);padding:22px 18px;display:flex;flex-direction:column;gap:12px;text-align:center;position:relative}
.cert .imie{font-family:var(--f-tytul);font-size:2rem;line-height:1.1;word-break:break-word}
.cert ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px;text-align:left}
.cert li{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dotted var(--linia);padding-bottom:4px;font-size:.95rem}
.cert li span:last-child{font-family:var(--f-mono);color:var(--szary);text-align:right}
.partytura{font-family:var(--f-mono);font-size:.95rem;line-height:1.8;letter-spacing:.04em}
.zegar-duzy{font-family:var(--f-mono);font-size:clamp(3rem,18vw,7rem);line-height:1;font-variant-numeric:tabular-nums}
.plan li{padding:4px 0}.plan li.teraz{color:var(--pieczec);font-weight:700}
dialog{background:var(--karta);color:var(--atrament);border:2px solid var(--atrament);max-width:620px;width:calc(100% - 32px);max-height:85vh;padding:0}
dialog::backdrop{background:rgba(10,12,16,.6)}
dialog .wnetrze{padding:18px;display:flex;flex-direction:column;gap:12px}
dl.slow{margin:0;display:flex;flex-direction:column;gap:10px}
dl.slow dt{font-weight:600} dl.slow dd{margin:0;font-size:.95rem;color:var(--szary)}
@keyframes stempel{0%{transform:scale(1.8) rotate(-12deg);opacity:0}60%{transform:scale(.95) rotate(-4deg);opacity:1}100%{transform:scale(1) rotate(-4deg)}}
.pieczec.nowa{animation:stempel .45s ease-out}
@media (prefers-reduced-motion:reduce){.pieczec.nowa{animation:none}}
</style>
</head>
<body>

<div class="wrap">
  <header class="pasek" id="pasek">
    <div class="lewy">
      <button class="btn" id="btn-spis" type="button">Dziennik</button>
      <button class="btn" id="btn-slownik" type="button">Słowniczek</button>
    </div>
    <div class="mono" style="display:flex;gap:12px;align-items:center;font-size:.86rem">
      <span id="zegarek">--:--</span>
      <span id="punkty" style="color:var(--pieczec);font-weight:700">0 🦴</span>
    </div>
  </header>
  <main id="ekran" class="stos" aria-live="polite"></main>
</div>

<dialog id="slownik"><div class="wnetrze">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2 style="font-size:1.6rem">Słowniczek</h2><button class="btn" type="button" id="zamknij-slownik">Zamknij</button></div>
  <dl class="slow" id="lista-slownik"></dl>
</div></dialog>

<script>
"use strict";
/* ===================== TREŚĆ ===================== */
const CZAS_GRY=20; // minut
const PLAN=[{od:0,do:2},{od:2,do:5},{od:5,do:8},{od:8,do:12},{od:12,do:14},{od:14,do:17},{od:17,do:20}];

const ROZDZIALY=[
{ w:"PROLOG", miejsce:"Westfalia", tytul:"Zamek Thunder-ten-Tronkh", temat:"anatomia sieci dostępowej",
  dziennik:`Kiszone ogórki w kącie fermentują, a ja razem z nimi. Listonosz przyniósł list z pieczęcią barona Friedricha Heinricha Marii Telesfora Teodora Filemona de Thunder-ten-Tronkh. <b>Skradziono dokumenty rodowodowe Volt-R-a.</b> Bez nich owczarek traci szlachectwo, a ród — twarz przed Von Jägermeisterami. Jadę. Nie dlatego, że wierzę w sukces. Dlatego, że w domu i tak nic się nie dzieje.`,
  scena:[["Baron","Mój drogi Stanisławie! Zamek jest pusty, dokumenty zniknęły, a w wielkiej sali… pachnie kotami. Ród de Thunder-ten-Tronkh nie hoduje kotów. Trzymamy się francuskiego „de” i psów, z równym uporem."],
         ["Volt-R","Hau. (drapie łapą róg sali)"],
         ["Głąb","Kocia sierść i liście waleriany. To podpis Wieńczysława Nieszczególnego. A ten zapach… jaśminowe perfumy męskie. Bogumił Kadryll. Dawni wspólnicy, od lat śmiertelni rywale. Skoro byli tu obaj, polowali na to samo."],
         ["Baron","Gdzie mogli uciec?"],
         ["Głąb","Byle gdzie, byle był Internet. Złodziej bez łącza to dziś złodziej bez mapy. Zanim ruszymy, sprawdźmy, jak w ogóle wygląda droga od czyjegoś domu do sieci operatora. Ja i baron ścigamy Nieszczególnego. Baronowa i Volt-R — Kadrylla."]],
  karty:[`<h4>Jedna anatomia, wiele technologii</h4><div class="wzor">urządzenie abonenckie → przyłącze → punkt pośredni
→ węzeł dostępowy → agregacja → BNG → sieć IP

DSLAM (miedź) · CMTS (kablówka) · OLT (światłowód)
· stacja bazowa (radio)</div><p><b>BNG</b> uwierzytelnia abonenta, nadaje mu adres IP i pilnuje taryfy. <b>Wskaźnik wykorzystania</b> = gospodarstwa przyłączone / gospodarstwa w zasięgu.</p>`,
         `<h4>Zasady pościgu</h4><ul><li>Dobra odpowiedź za pierwszym razem: <b>10 smaczków dla Volt-R-a</b> 🦴, za drugim 5, za trzecim 2. Po trzech pudłach Volt-R sam wskazuje odpowiedź.</li><li>Kolejny etap otwiera się po rozwiązaniu wszystkich zadań poprzedniego.</li><li>Wolno, a nawet warto naradzać się z sąsiadem.</li></ul>`],
  pytania:[
   {t:"dop",q:"Głąb rysuje w notesie drogę danych z zamku do sieci operatora. Proszę przyporządkować elementy do ich ról.",
    el:[["router Wi-Fi z modemem w bibliotece barona","urządzenie abonenckie"],["kabel od studzienki przy bramie do zamku","przyłącze"],["urządzenie w budynku operatora obsługujące setki abonentów (DSLAM, CMTS, OLT)","węzeł dostępowy"],["router, który uwierzytelnia barona, nadaje mu adres IP i pilnuje taryfy","BNG"]],
    kat:["urządzenie abonenckie","przyłącze","węzeł dostępowy","BNG"],
    e:"Każda technologia dostępowa ma tę samą anatomię; różni się zawartością „szufladek”."},
   {t:"num",q:"Światłowód przechodzi obok 400 domów w okolicy zamku, a usługę kupiło 100 gospodarstw. Ile wynosi wskaźnik wykorzystania (w procentach)?",a:25,tol:0.5,j:"%",
    e:"100 / 400 = 25%. Koszt trasy rozkłada się tylko na tych, którzy kupili usługę."},
   {t:"mc",q:"Dlaczego doprowadzenie kabla do zamku na odludziu kosztuje wielokrotnie więcej niż do mieszkania w bloku?",
    o:["Najdroższe są roboty budowlane, a na kilometr trasy przypada tu bardzo mało klientów","Światłowód na wsi jest droższy w hurtowni","Zamki wymagają specjalnych, szlacheckich kabli","Na wsi trzeba stosować wyższe częstotliwości"],a:0,
    e:"Rozkopy, przewierty i pozwolenia to często ponad połowę kosztu. Decyduje liczba gospodarstw na kilometr trasy."}
  ]},
{ w:"ETAP I", miejsce:"Buenos Aires", tytul:"Kamienica pełna kotów", temat:"xDSL",
  dziennik:`Ślad waleriany prowadzi do starej kamienicy w San Telmo. Na dachu dwadzieścia kotów, w piwnicy szafka rozdzielcza z setkami par miedzianych. Nieszczególny wynajął mieszkanie na trzecim piętrze. Łączy się ze światem po <b>parze telefonicznej</b>, jak w latach dziewięćdziesiątych. Baron uważa, że to romantyczne. Ja uważam, że to wolne.`,
  scena:[["Baron","Stanisławie, ta para miedziana pamięta jeszcze tango z gramofonu! Jak przez nią w ogóle płyną dane?"],
         ["Głąb","Modulacją wielotonową. Pasmo dzielą na tysiące podnośnych co 4,3125 kHz; każda dostaje tyle bitów, na ile pozwala jej stosunek sygnału do szumu. Cztery tysiące symboli na sekundę."],
         ["Baron","A jeśli wszyscy lokatorzy naraz oglądają mecz?"],
         ["Głąb","Wtedy pary w jednym kablu przekrzykują się nawzajem. Przesłuch. Coś jak koty na dachu o północy."]],
  karty:[`<h4>Ściąga z xDSL</h4><div class="wzor">R = 4000 symboli/s × Σ bitów podnośnych
b ≤ 15 bitów na podnośną
PPPoE: 8 B nagłówków → MTU 1500 − 8 = 1492 B</div><ul><li><b>Wektoryzacja</b> usuwa przesłuch zdalny, ale wymaga jednego systemu dla wszystkich par w kablu.</li><li><b>G.fast</b>: krótkie linie, pasmo do 212 MHz, kierunki dzielone czasem (TDD).</li></ul>`],
  pytania:[
   {t:"num",q:"W łączu Nieszczególnego jedna z podnośnych przenosi 10 bitów w każdym symbolu DMT. Jaką przepływność wnosi ta jedna podnośna (w kbit/s)?",a:40,tol:0,j:"kbit/s",
    e:"4000 symboli/s × 10 bitów = 40 000 bit/s = 40 kbit/s. Takich podnośnych są tysiące."},
   {t:"mc",q:"Wieczorem łącze Nieszczególnego zwalnia z 150 do 70 Mbit/s, choć jego linia ma tylko 300 m. Co jest głównym winowajcą?",
    o:["przesłuch zdalny (FEXT) z innych par w tym samym kablu","koty siedzące na kablu","zbyt mała moc DSLAM","pole TTL w nagłówku IP"],a:0,
    e:"Na krótkich liniach VDSL2 to przesłuch, a nie szum tła, ogranicza przepływność. Lekarstwem jest wektoryzacja."},
   {t:"num",q:"Router Nieszczególnego zestawia sesję PPPoE. Ile wynosi MTU dla pakietów IP na tym łączu (w bajtach)?",a:1492,tol:0,j:"B",
    e:"1500 − 8 B nagłówków PPPoE i PPP = 1492 B."},
   {t:"mc",q:"Baron chce wynająć jedną parę w tej kamienicy i podłączyć własny DSLAM. Operator odmawia: kabel jest wektoryzowany. Dlaczego to ma znaczenie?",
    o:["Wektoryzacja działa tylko wtedy, gdy jeden system zna sygnały wszystkich par w kablu; „obca” para zakłócałaby pozostałe","Wektoryzacja jest zastrzeżona dla rodów z „von”","Wektoryzowane pary nie przenoszą głosu","Wektoryzacja wymaga światłowodu do mieszkania"],a:0,
    e:"Dlatego regulatorzy zastąpili wynajem pojedynczych par (LLU) dostępem wirtualnym."}
  ]},
{ w:"ETAP II", miejsce:"Nowy Jork", tytul:"Hotel z kablówką", temat:"HFC i DOCSIS",
  dziennik:`Depesza od baronowej: <b>Volt-R zwęszył jaśmin w hotelu na Manhattanie.</b> Kadryll mieszka dwa piętra wyżej. Hotel ma starą sieć kablową: światłowód do węzła w piwnicy, dalej kabel koncentryczny do wszystkich pokoi. Baronowa podłączyła laptop do gniazdka w swoim pokoju i liczy, że „podsłucha” Kadrylla.`,
  scena:[["Baronowa","Skoro kabel koncentryczny jest wspólny dla całego hotelu, sygnał Kadrylla dociera także do mojego modemu. Wystarczy go odczytać!"],
         ["Volt-R","Hau. (z powątpiewaniem)"],
         ["Baronowa","Dociera… ale jest zupełnie nieczytelny. A gdy próbuję coś wysłać poza kolejnością, nic się nie dzieje."],
         ["Głąb (przez telefon)","Bo w DOCSIS w dół wszystko jest szyfrowane, a w górę nadaje się tylko wtedy, gdy pozwoli CMTS. Proszę zostawić modem i zaufać nosowi psa."]],
  karty:[`<h4>Ściąga z DOCSIS</h4><ul><li>W dół: CMTS rozsyła ramki do <b>wszystkich</b> modemów w węźle; każdy bierze swoje. Ruch jest szyfrowany (BPI+).</li><li>W górę: modem <b>prosi</b>, CMTS rozsyła <b>mapę przydziałów</b> (żądanie–przydział).</li><li>Na aktywnego abonenta: przepływność węzła / (domy × wskaźnik wykorzystania × aktywność).</li><li><b>Dzielenie węzła</b> na pół podwaja przepływność na abonenta.</li></ul>`],
  pytania:[
   {t:"mc",q:"Dlaczego baronowa nie mogła odczytać danych Kadrylla, choć fizycznie docierały do jej modemu?",
    o:["Transmisja w dół w DOCSIS jest szyfrowana dla każdego modemu","Koncentryk przenosi dane tylko do jednego pokoju","Kadryll używał gołębi pocztowych","Modem baronowej był wyłączony"],a:0,
    e:"Medium współdzielone w kierunku „w dół” wymaga szyfrowania — tak samo jest w sieciach PON."},

const qid=(k,i)=>k+"-"+i;
const wszystkie=()=>ROZDZIALY.flatMap((r,k)=>r.pytania.map((_,i)=>qid(k,i)));
const maks=()=>wszystkie().length*10;
const suma=()=>Object.values(S.odp).reduce((s,o)=>s+(o.pkt||0),0);
const gotowy=k=>ROZDZIALY[k].pytania.every((_,i)=>S.odp[qid(k,i)]&&S.odp[qid(k,i)].koniec);
const otwarty=k=>k===0||gotowy(k-1);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ===================== ZEGAR ===================== */
const mmss=ms=>{const s=Math.max(0,Math.floor(ms/1000));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");};
function tykaj(){
  const z=document.getElementById("zegarek");
  if(!S.start){z.textContent="--:--";return;}
  const ms=Date.now()-S.start,m=ms/60000,i=PLAN.findIndex(p=>m>=p.od&&m<p.do);
  z.textContent=mmss(ms)+" · "+(m>=CZAS_GRY?"czas na kolację":ROZDZIALY[i].miejsce);
}
setInterval(tykaj,1000);
function odswiezPunkty(){document.getElementById("punkty").textContent=suma()+" 🦴";}

/* ===================== NAWIGACJA ===================== */
const E=document.getElementById("ekran");
function idz(h){if(location.hash==="#"+h)render();else location.hash=h;}
window.addEventListener("hashchange",render);
document.getElementById("btn-spis").onclick=()=>idz("dziennik");
const dlg=document.getElementById("slownik");
document.getElementById("btn-slownik").onclick=()=>{try{dlg.showModal();}catch(e){dlg.setAttribute("open","");}};
document.getElementById("zamknij-slownik").onclick=()=>dlg.close();
document.getElementById("lista-slownik").innerHTML=SLOWNIK.map(([a,b])=>`<div><dt>${a}</dt><dd>${b}</dd></div>`).join("");

let sprzatanie=null;
function render(){
  if(sprzatanie){sprzatanie();sprzatanie=null;}
  const h=location.hash.replace("#","");
  document.getElementById("pasek").hidden=(h==="rzutnik");
  if(h==="rzutnik")return widokRzutnik();
  if(h==="certyfikat")return widokCert();
  const m=h.match(/^etap-(\d)$/);
  if(m&&ROZDZIALY[+m[1]]&&S.start&&otwarty(+m[1]))return widokRozdzial(+m[1]);
  widokDziennik();
}

    <p class="sygn">Sygn. akt AST/W6/2026 · czas pościgu: ${CZAS_GRY} minut · ${wszystkie().length} zadań</p>
    ${pocz?`<label for="imie" class="etykieta">Imię lub pseudonim (do certyfikatu)</label>
      <input id="imie" type="text" maxlength="40" placeholder="np. Aspirantka Ada" value="${esc(S.imie||"")}">
      <button class="btn glowny" id="start" type="button">Wsiadam do pociągu</button>`
      :`<p class="mono" style="font-size:.86rem;color:var(--szary)">Uczestnik pościgu: <b style="color:var(--atrament)">${esc(S.imie||"bez nazwiska")}</b> · ${suma()} z ${maks()} smaczków</p>`}
  </section>
  <h3>Trasa pościgu</h3>
  <ol class="spis">${ROZDZIALY.map((r,i)=>{
    const st=gotowy(i)?"zrobione":(otwarty(i)?"otwarte":"zamkniete");
    return `<li class="${st}"><button type="button" data-k="${i}" ${(st==="zamkniete"||pocz)?'aria-disabled="true"':""}>
      <span class="w">${r.w}</span><span class="t">${r.miejsce}: ${r.tytul}<small>${r.temat} · min ${PLAN[i].od}–${PLAN[i].do}</small></span>
      <span class="s">${st==="zrobione"?"stempel ✓":st==="zamkniete"?"przed nami":"w drodze"}</span></button></li>`;}).join("")}
    <li class="${ROZDZIALY.every((_,i)=>gotowy(i))?"otwarte":"zamkniete"}"><button type="button" data-k="cert">
      <span class="w">EPILOG</span><span class="t">Kolacja w Pekinie<small>certyfikat pościgu</small></span><span class="s">🥢</span></button></li>
  </ol>`;
  if(pocz)document.getElementById("start").onclick=()=>{S.imie=document.getElementById("imie").value.trim();S.start=Date.now();zapisz();tykaj();idz("etap-0");};
  E.querySelectorAll(".spis button").forEach(b=>b.onclick=()=>{
    if(!S.start)return;const k=b.dataset.k;
    if(k==="cert"){idz("certyfikat");return;}
    if(otwarty(+k))idz("etap-"+k);
  });
  window.scrollTo(0,0);
}

function widokRozdzial(k){
  const R=ROZDZIALY[k];
  E.innerHTML=`
   <div class="stos" style="gap:6px"><span class="etykieta">${R.w} · ${R.miejsce} · ${R.temat}</span><h2>${R.tytul}</h2></div>
   <div class="dziennik"><span class="etykieta" style="display:block;margin-bottom:6px">Z dziennika Głąba</span>${R.dziennik}</div>
   <dl class="replika">${R.scena.map(([kto,co])=>`<dt>${kto.toUpperCase()}</dt><dd>${co}</dd>`).join("")}</dl>
   ${R.karty.map(c=>`<div class="karta">${c}</div>`).join("")}
   <h3>Zadania</h3>
   <div class="stos" id="zadania"></div>
   <div class="nawigacja" id="nawi"></div>`;
  const Z=document.getElementById("zadania");
  R.pytania.forEach((q,i)=>Z.appendChild(zadanie(k,i,q)));
  nawigacja(k);window.scrollTo(0,0);
}

function nawigacja(k){
  const N=document.getElementById("nawi");if(!N)return;
  const ost=k===ROZDZIALY.length-1;
  N.innerHTML=`<button class="btn" type="button" id="wstecz">← Dziennik</button>
   <button class="btn glowny" type="button" id="dalej" ${gotowy(k)?"":"disabled"}>${ost?"Kolacja w Pekinie →":"Następny etap →"}</button>`;
  document.getElementById("wstecz").onclick=()=>idz("dziennik");
  document.getElementById("dalej").onclick=()=>{if(gotowy(k))idz(ost?"certyfikat":"etap-"+(k+1));};
}

/* ===================== ZADANIA ===================== */
function tasuj(id,n){ // stała dla danego zadania permutacja odpowiedzi
  let h=2166136261;for(const c of id+"#W6")h=Math.imul(h^c.charCodeAt(0),16777619)>>>0;
  const a=[...Array(n).keys()];
  for(let i=n-1;i>0;i--){h=Math.imul(h^(h>>>15),2246822519)>>>0;const j=h%(i+1);[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
const PKT=[10,5,2];
function zadanie(k,i,q){
  const id=qid(k,i),el=document.createElement("div");el.className="zagadka";
  const o=S.odp[id]||(S.odp[id]={proby:0,koniec:false,pkt:0,zle:[]});
  let tor=[], wyb=[];
  function wynik(dobrze,j){
    if(o.koniec)return;
    if(dobrze){o.pkt=PKT[o.proby]||0;o.koniec=true;}
    else{o.proby++;if(j!==undefined)o.zle.push(j);if(o.proby>=3){o.koniec=true;o.pkt=0;}}
    zapisz();rysuj();odswiezPunkty();nawigacja(k);
  }
  const fmt=v=>String(Math.round(v*100)/100).replace(".",",");
  function rysuj(){
    el.classList.toggle("rozw",o.koniec);
    let srodek="";
    if(q.t==="mc"){
      srodek=`<div class="opcje">${tasuj(id,q.o.length).map(j=>{const t=q.o[j];let c="opcja";if(o.zle.includes(j))c+=" zla";if(o.koniec&&j===q.a)c+=" dobra";
        return `<button type="button" class="${c}" data-j="${j}" ${(o.koniec||o.zle.includes(j))?"disabled":""}>${t}</button>`;}).join("")}</div>`;
    }else if(q.t==="num"){
      srodek=`<div class="liczba"><input type="text" inputmode="decimal" id="in-${id}" aria-label="odpowiedź" placeholder="wynik${q.j?" w "+q.j:""}" ${o.koniec?"disabled":""} value="${o.koniec?fmt(q.a):""}"><button class="btn" type="button" data-s ${o.koniec?"disabled":""}>Sprawdź</button></div>`;
    }else if(q.t==="ord"){
      const pokaz=o.koniec?q.el.map((_,j)=>j):tor;
      srodek=`<div class="tor" aria-label="ułożona kolejność">${pokaz.length?pokaz.map((j,n)=>`<button type="button" class="zeton" data-t="${n}" ${o.koniec?"disabled":""}><span class="n">${n+1}.</span>${q.el[j]}</button>`).join(""):`<span class="etykieta" style="align-self:center">tu pojawi się kolejność</span>`}</div>
        ${o.koniec?"":`<div class="pula">${q.mix.filter(j=>!tor.includes(j)).map(j=>`<button type="button" class="zeton" data-p="${j}">${q.el[j]}</button>`).join("")}</div>
        <div><button class="btn" type="button" data-s ${tor.length===q.el.length?"":"disabled"}>Sprawdź kolejność</button></div>`}`;
    }else if(q.t==="dop"){
      srodek=`<div class="dopasuj">${q.el.map(([t,kat],j)=>`<span>${t}</span><select id="s-${id}-${j}" aria-label="${esc(t)}" ${o.koniec?"disabled":""}>
        <option value="">wybierz…</option>${q.kat.map(c=>`<option ${(o.koniec?c===kat:wyb[j]===c)?"selected":""}>${c}</option>`).join("")}</select>`).join("")}</div>
        ${o.koniec?"":`<div><button class="btn" type="button" data-s>Sprawdź przyporządkowanie</button></div>`}`;
    }
    let stat="";
    if(o.koniec)stat=o.pkt>0?`<span class="ok mono">+${o.pkt} 🦴</span>`:`<span class="mono" style="color:var(--mosiadz)">Volt-R wskazał odpowiedź łapą</span>`;
    else if(o.proby>0)stat=`<span class="zle mono">pudło ${o.proby}/3</span>`;
    el.innerHTML=`<div class="nr"><span class="etykieta">Zadanie ${i+1}</span>${stat}</div><p>${q.q}</p>${srodek}<p class="mono zle" data-info hidden></p>
      ${o.koniec?`<p class="wyjasnienie">${q.e}</p>`:""}`;
    const info=el.querySelector("[data-info]");
    if(q.t==="mc")el.querySelectorAll(".opcja").forEach(b=>b.onclick=()=>wynik(+b.dataset.j===q.a,+b.dataset.j));
    if(q.t==="num"){const inp=el.querySelector("input"),bt=el.querySelector("[data-s]");
      if(bt&&!o.koniec){bt.onclick=()=>{const v=parseFloat(inp.value.replace(/\s/g,"").replace(",","."));if(isNaN(v)){inp.focus();return;}wynik(Math.abs(v-q.a)<=q.tol+1e-9);};
        inp.onkeydown=ev=>{if(ev.key==="Enter")bt.click();};}}
    if(q.t==="ord"&&!o.koniec){
      el.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{tor.push(+b.dataset.p);rysuj();});
      el.querySelectorAll(".tor [data-t]").forEach(b=>b.onclick=()=>{tor.splice(+b.dataset.t,1);rysuj();});
      const bt=el.querySelector("[data-s]");
      if(bt)bt.onclick=()=>{const dobrze=tor.filter((j,n)=>j===n).length;const ok=dobrze===q.el.length;
        if(!ok){tor=[];wynik(false);const inf=el.querySelector("[data-info]");if(inf&&!o.koniec){inf.hidden=false;inf.textContent=`Na swoim miejscu: ${dobrze} z ${q.el.length}. Proszę spróbować jeszcze raz.`;}}
        else wynik(true);};
    }
    if(q.t==="dop"&&!o.koniec){
      q.el.forEach((_,j)=>{const s=el.querySelector(`#s-${id}-${j}`);s.onchange=()=>{wyb[j]=s.value;};});
      el.querySelector("[data-s]").onclick=()=>{
        const w=q.el.map((_,j)=>el.querySelector(`#s-${id}-${j}`).value);
        if(w.some(x=>!x)){info.hidden=false;info.textContent="Proszę wybrać odpowiedź w każdym wierszu.";return;}
        const dobrze=w.filter((x,j)=>x===q.el[j][1]).length;
        if(dobrze===q.el.length)wynik(true);
        else{wynik(false);const inf=el.querySelector("[data-info]");if(inf&&!o.koniec){inf.hidden=false;inf.textContent=`Poprawnie: ${dobrze} z ${q.el.length}.`;}}
      };
    }
  }
  rysuj();return el;
}

/* ===================== CERTYFIKAT ===================== */
function kodWer(imie,pkt){let h=5381;const s=(imie||"").trim().toLowerCase()+"|"+pkt+"|AST-W6";for(const c of s)h=((h*33)^c.charCodeAt(0))>>>0;return h.toString(36).toUpperCase().slice(-6).padStart(6,"0");}
function ranga(p){return p>=.9?"Komisarz światłowodowy z odznaką Volt-R-a":p>=.75?"Inspektor ostatniej mili":p>=.5?"Aspirant pętli abonenckiej":"Posterunkowy na stażu u Volt-R-a";}
function widokCert(){
  const p=suma(),m=maks();
  if(!S.start||!ROZDZIALY.every((_,i)=>gotowy(i))){E.innerHTML=`<h2>Kolacja</h2><p>Stolik w pekińskiej kawiarni jest zarezerwowany, ale pościg jeszcze trwa. Proszę ukończyć wszystkie etapy.</p><div><button class="btn" type="button" onclick="location.hash='dziennik'">← Dziennik</button></div>`;return;}
  const d=new Date(),pr=p/m;
  const zdob=UMIEJETNOSCI.slice(0,Math.max(3,Math.round(pr*UMIEJETNOSCI.length)));
  E.innerHTML=`
   <div class="stos" style="gap:6px"><span class="etykieta">Epilog · mała kawiarnia w Pekinie</span><h2>Kolacja w Pekinie</h2></div>
   <dl class="replika">
     <dt>NARRATOR</dt><dd>Przy jednym stoliku siedzą: emerytowany komisarz, baron, baronowa, owczarek z odzyskanym szlachectwem i dwaj najsłynniejsi włamywacze stulecia. Pierożki stygną, nikt się nie spieszy.</dd>
     <dt>KADRYLL</dt><dd>Komisarzu, ten pana wywód o dwóch długościach fali w jednym włóknie… Wieńczysław i ja chcemy coś panu ofiarować.</dd>
     <dt>NIESZCZEGÓLNY</dt><dd>Sfinansujemy panu studia z muzyki minimalistycznej. Zawsze pan o nich marzył, prawda?</dd>
     <dt>GŁĄB</dt><dd>(po raz pierwszy od lat nie wie, co powiedzieć)</dd>
     <dt>VOLT-R</dt><dd>Hau! (wystawia rekomendację odciskiem łapy)</dd>
   </dl>
   <div class="cert">
     <span class="pieczec nowa" style="align-self:center">SPRAWA ZAMKNIĘTA</span>
     <span class="etykieta">Certyfikat pościgu · sygn. AST/W6/${d.getFullYear()}</span>
     <div class="imie">${esc(S.imie||"Uczestnik bez nazwiska")}</div>
     <p>przeszedł(-szła) z komisarzem Głąbem ostatnią milę na sześciu kontynentach — od miedzi w Buenos Aires po światłowód w Tokio — i zebrał(a) dla Volt-R-a</p>
     <div class="zegar-duzy" style="font-size:3rem">${p} / ${m}</div>
     <p class="mono">smaczków (${Math.round(100*pr)}%) · ranga: <b style="color:var(--pieczec)">${ranga(pr)}</b></p>
     <ul>${zdob.map(([u,kto])=>`<li><span>${u}</span><span>— ${kto}</span></li>`).join("")}</ul>
     <p class="mono" style="font-size:.8rem;color:var(--szary)">${d.toLocaleString("pl-PL")} · kod weryfikacyjny: <b style="color:var(--atrament)">${kodWer(S.imie,p)}</b></p>
   </div>
   <div class="karta"><span class="etykieta">Głąb zapisuje na serwetce szkic swojego pierwszego utworu minimalistycznego</span>
     <p class="partytura"><i>„Etiuda na rozgałęźnik 1:32 i psa”</i><br>
     1490 · 1310 · 1490 · 1310 ·<br>
     1490 · 1310 · 1490 · 1310 ·<br>
     1490 · 1310 · 1577 · 1270 ·<br>
     (powtarzać, aż wszyscy złodzieje się pogodzą)<br>
     hau.</p></div>
   <p style="color:var(--szary);font-size:.95rem">Proszę zrobić zrzut ekranu całego certyfikatu. Wiedza z tego pościgu może pojawić się w quizie na ćwiczeniach.</p>
   <div class="nawigacja"><button class="btn" type="button" id="dm">← Dziennik</button></div>`;
  document.getElementById("dm").onclick=()=>idz("dziennik");window.scrollTo(0,0);
}

/* ===================== RZUTNIK ===================== */
let rzStart=null;
function widokRzutnik(){
  E.innerHTML=`<div class="stos" style="padding-top:16px">
   <span class="etykieta">Tryb rzutnika · Wykład 6 · Sieci dostępowe</span>
   <h1>Ostatnia mila komisarza Głąba</h1>
   <div class="zegar-duzy" id="rz-zegar">${String(CZAS_GRY).padStart(2,"0")}:00</div>
   <div><button class="btn glowny" type="button" id="rz-start">Start pościgu (${CZAS_GRY} min)</button></div>
   <ol class="plan" id="rz-plan">${PLAN.map((p,i)=>`<li data-i="${i}"><span class="mono">${p.od}–${p.do} min</span> · ${ROZDZIALY[i].miejsce}: ${ROZDZIALY[i].tytul} <span class="etykieta">(${ROZDZIALY[i].temat})</span></li>`).join("")}</ol>
   <div class="karta"><h4>Sprawdzenie kodu z certyfikatu</h4>
     <label class="etykieta" for="w-imie">Imię z certyfikatu</label><input type="text" id="w-imie">
     <label class="etykieta" for="w-pkt">Liczba smaczków</label><input type="number" id="w-pkt">
     <p class="mono" id="w-kod">Kod: –</p></div></div>`;
  const z=document.getElementById("rz-zegar");
  const t=setInterval(()=>{if(!rzStart)return;const ms=CZAS_GRY*60000-(Date.now()-rzStart),m=(Date.now()-rzStart)/60000;
    z.textContent=ms>0?mmss(ms):"KOLACJA!";
    document.querySelectorAll("#rz-plan li").forEach(li=>{const p=PLAN[+li.dataset.i];li.classList.toggle("teraz",m>=p.od&&m<p.do);});},500);
  document.getElementById("rz-start").onclick=()=>{rzStart=Date.now();};
  const wk=()=>{document.getElementById("w-kod").textContent="Kod: "+kodWer(document.getElementById("w-imie").value,document.getElementById("w-pkt").value);};
  document.getElementById("w-imie").oninput=wk;document.getElementById("w-pkt").oninput=wk;
  sprzatanie=()=>clearInterval(t);
}

/* ===================== START ===================== */
if(!location.hash&&S.start)location.hash="dziennik";
render();tykaj();odswiezPunkty();
</script>
